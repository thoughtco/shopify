name: Docs

# Asks docs.tc to pull this repo's docs/ into the site. docs.tc does the sync
# and commit (see its sync-addon-docs workflow); this only sends the request.
#
# Runs on release (release.yml triggers it explicitly, since releases it creates
# with GITHUB_TOKEN don't fire release events) or by hand.
#
# Needs secret DOCS_TC_DISPATCH_TOKEN: a fine-grained token for thoughtco/docs.tc
# with "Contents: read and write".

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or branch to publish. Defaults to the latest release.'
        required: false
        type: string
      docs_version:
        description: 'Version node on docs.tc, e.g. 8.x. Only needed for a branch.'
        required: false
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve ref
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          if [ -z "$REF" ]; then
            REF=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi

          echo "REF=$REF" >> "$GITHUB_ENV"

      - name: Request docs.tc sync
        env:
          GH_TOKEN: ${{ secrets.DOCS_TC_DISPATCH_TOKEN }}
          DOCS_VERSION: ${{ inputs.docs_version }}
        run: |
          gh api repos/thoughtco/docs.tc/dispatches \
            -f event_type=addon-docs \
            -f "client_payload[site]=shopify" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[docs_version]=$DOCS_VERSION"

          echo "Requested a docs.tc sync of $REF: https://github.com/thoughtco/docs.tc/actions/workflows/sync-addon-docs.yml"
