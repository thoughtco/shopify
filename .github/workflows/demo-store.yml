name: Deploy demo store

# Redeploys https://shopify-demo.docs.tc when a release is published, so the demo
# runs the latest version (its deploy script updates thoughtco/shopify).
on:
  release:
    types: [released]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Ploi deployment
        run: curl --fail --silent --show-error -X POST "${{ secrets.DEMO_DEPLOY_WEBHOOK }}"
